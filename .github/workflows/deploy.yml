name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      # 🔹 Login to DockerHub
      - name: Docker Login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      # 🔹 Build Backend JAR
      - name: Build Backend JAR
        run: |
          cd backend
          mvn clean package -DskipTests
      # 🔹 Build Backend
      - name: Build Backend Image
        run: |
          cd backend
          docker build -t ${{ secrets.DOCKER_USERNAME }}/employee-backend:latest .

      # 🔹 Push Backend
      - name: Push Backend Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/employee-backend:latest

      # 🔹 Build Frontend
      - name: Build Frontend Image
        run: |
          cd frontend
          docker build -t ${{ secrets.DOCKER_USERNAME }}/employee-frontend:latest .

      # 🔹 Push Frontend
      - name: Push Frontend Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/employee-frontend:latest

      # 🔹 Configure AWS
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: eu-north-1

      # 🔹 Update kubeconfig
      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name my-cluster --region eu-north-1

      # 🔹 Deploy to Kubernetes
      - name: Deploy to EKS
        run: |
          kubectl rollout restart deployment backend-deployment
          kubectl rollout restart deployment frontend-deployment
