apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: yugandhar25/employee-backend:latest
          ports:
            - containerPort: 8080
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                 name: app-secret
                 key: JWT_SECRET

            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://database-1.cluuw2gc0stc.eu-north-1.rds.amazonaws.com:3306/employee_db"

            - name: SPRING_DATASOURCE_USERNAME
              value: "admin"

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                 name: app-secret
                 key: DB_PASSWORD